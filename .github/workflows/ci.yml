name: ClaimFlow CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Stage 1: Lint & Architecture Gate (NFR-08, Layer Separation)
  # =========================================================================
  lint-and-archtest:
    name: "Stage 1: Lint & ArchTest"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Static Code Linting
        run: |
          ruff check backend/src/

      - name: Architectural AST Rules Verification (NFR-08)
        run: |
          cd backend
          python -m pytest tests/unit/test_architecture_rules.py -v

  # =========================================================================
  # Stage 2: Build & Static Analysis Gate (NFR-01, Fixed-Point Audit)
  # =========================================================================
  build-and-compile:
    name: "Stage 2: Build & Compile"
    needs: lint-and-archtest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Python Bytecode Compilation & AST Audit
        run: |
          python -m compileall backend/src/

      - name: Verify Fixed-Point Arithmetic & Financial Invariants
        run: |
          cd backend
          python -m pytest tests/unit/test_financial_assessment.py tests/unit/test_expanded_services.py -v

  # =========================================================================
  # Stage 3: Automated Tests & Coverage Gate (AC-01..10, >= 85% Ratchet)
  # =========================================================================
  automated-tests-coverage:
    name: "Stage 3: Automated Tests & Coverage"
    needs: build-and-compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Full Test Suite with Coverage
        run: |
          cd backend
          python -m pytest --cov=src/claimflow --cov-report=xml:coverage.xml --cov-report=json:coverage.json --cov-report=term -v

      - name: Generate Readable Markdown & HTML Coverage Reports
        run: |
          python scripts/generate_coverage_report.py

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-artifacts
          path: |
            coverage-report.md
            backend/coverage.xml
            backend/coverage.json
            htmlcov/

  # =========================================================================
  # Stage 4: Claude Code Agent Gate (Evaluator SDK & Playwright MCP)
  # =========================================================================
  agent-evaluator-gate:
    name: "Stage 4: Claude Agent Gate & Evaluator SDK"
    needs: automated-tests-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          npm install -g @playwright/test @modelcontextprotocol/server-playwright
          npx playwright install --with-deps chromium

      - name: Start ClaimFlow API and Frontend Services in Background
        run: |
          cd backend
          nohup python -m uvicorn claimflow.main:app --host 0.0.0.0 --port 8000 --app-dir src > backend.log 2>&1 &
          cd ../frontend
          nohup python -m http.server 3000 > frontend.log 2>&1 &
          cd ..
          sleep 4

      - name: Execute Playwright E2E Browser Journeys
        env:
          UI_BASE_URL: "http://localhost:3000"
          EVAL_BASE_URL: "http://localhost:8000"
        run: |
          npx playwright test

      - name: Execute Programmatic Evaluator SDK via CI Agent Runner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVAL_BASE_URL: "http://localhost:8000"
          UI_BASE_URL: "http://localhost:3000"
        run: |
          python scripts/ci_agent_runner.py

      - name: Upload Evaluator & Playwright Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-artifacts
          path: |
            specs/reviews/ac-verification-report.md
            .claude/state/eval-scores.json
            .claude/state/coverage-baseline.txt
            playwright-report/
            test-results/

  # =========================================================================
  # Stage 5: PR Merge Verification Gate (Enforces Non-Fast-Forward Rule)
  # =========================================================================
  pr-merge-gate:
    name: "Stage 5: PR Merge Gate"
    needs: agent-evaluator-gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify PR-Driven History & Prohibit Direct Fast-Forwards
        run: |
          echo "PR #${{ github.event.pull_request.number }} verified against all 4 prior stages."
          echo "Ready for non-fast-forward merge (git merge --no-ff)."
