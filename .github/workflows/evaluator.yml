name: Claude Code Agent Evaluator Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'specs/**'
      - '.claude/**'

jobs:
  agent-evaluation:
    name: "Autonomous Evaluator Review"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend & Evaluation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Start Background API Server
        run: |
          cd backend
          nohup python -m uvicorn claimflow.main:app --host 0.0.0.0 --port 8000 --app-dir src > backend.log 2>&1 &
          sleep 3

      - name: Run Programmatic Evaluator Agent SDK
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVAL_BASE_URL: "http://localhost:8000"
          UI_BASE_URL: "http://localhost:3000"
        run: |
          python scripts/run_evaluator_sdk.py

      - name: Post Evaluator Summary to Pull Request
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'specs/reviews/ac-verification-report.md';
            if (fs.existsSync(reportPath)) {
              const body = fs.readFileSync(reportPath, 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `### 🤖 ClaimFlow Autonomous Evaluator Report\n\n${body}`
              });
            }
